[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_log_extraction"]



[project]
name = "s3-log-extraction"
version="1.11.5"
authors = [
  { name="Cody Baker", email="cody.c.baker.phd@gmail.com" },
]
description = "Fast extraction of access summary data from S3 logs."
readme = "README.md"
keywords = [
    "AWS",
    "S3",
    "logging",
    "access stats",
    "usage analysis",
    "download tracking",
    "geolocation",
    "open data",
    "data infrastructure",
]
license = {file = "LICENSE.txt"}
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "tqdm",
    "PyYAML",
    "rich_click",
    "natsort",
    "psutil",
    "cryptography",
    "beartype",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
geolocation = [
    "geoip2",
    "requests",
]
remote = [
    "fsspec",
    "s3fs",
    "s5cmd",
]
all = ["s3_log_extraction[geolocation,remote]"]

[project.urls]
Documentation = "https://github.com/dandi/s3-log-extraction/blob/master/README.md"
Repository = "https://github.com/dandi/s3-log-extraction/"
Issues = "https://github.com/dandi/s3-log-extraction/issues"
Changelog = "https://github.com/dandi/s3-log-extraction/blob/master/CHANGELOG.md"

[project.scripts]
s3logextraction = "s3_log_extraction._command_line_interface._cli:s3logextraction_cli"

[dependency-groups]
test = ["pytest"]
coverage = ["pytest-cov", "pytest-env"]
dev = ["ipython", "pre-commit"]
all = [
    {include-group = "test"},
    {include-group = "coverage"},
    {include-group = "dev"}
]



[tool.black]
line-length = 120
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.toml
  |\.yml
  |\.txt
  |\.sh
  |\.git
  |\.ini
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''



[tool.ruff]
exclude = [
  "*/__init__.py"
]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- Conflicts with the formatter ---------------------------------------------------------------
    # `black` owns trailing commas, and ruff documents this rule as incompatible with a formatter
    "COM812",

    # --- Docstring convention -----------------------------------------------------------------------
    # Summaries are written on the line below the opening quotes, so prefer D213 over D212 and D211
    # over D203. Each pair is mutually exclusive, and ruff warns when both halves are selected
    "D203",
    "D212",
    # Blank-line and one-line placement inside a docstring is left to the author
    "D200",
    "D205",
    "D413",
    # Summaries read as descriptions rather than commands, and some begin by naming what they return
    "D401",
    "D404",
    # Not every module carries a module-level docstring
    "D100",

    # --- Contradicts a rule in AGENTS.md ------------------------------------------------------------
    # Internal imports are relative
    "TID252",
    # External dependencies are imported whole rather than under an alias
    "ICN001",
    # A result is bound to a named variable before being returned
    "RET504",
    # Imports live at the top of a file, except the lazy ones that keep the optional `geolocation` and
    # `remote` extras out of the base install. Those are annotated as strings, which reads to ruff as
    # an undefined name and as a needlessly quoted annotation
    "PLC0415",
    "F821",
    "UP037",

    # --- Deliberate here ----------------------------------------------------------------------------
    # Commands print to the terminal instead of logging
    "T201",
    # Status codes, column counts and other small literals read better inline than as named constants
    "PLR2004",
    # Boolean flags and long parameter lists are the published signatures of the API entry points.
    # Reshaping them to satisfy a linter would be a breaking change
    "FBT001",
    "FBT002",
    "PLR0913",
    # `random.shuffle` spreads the file order within a run. Nothing here is a security primitive
    "S311",
    # SHA-1 content-addresses each validator's awk script. It is not used for security, and the digest
    # becomes part of every validation record's file name, so changing it would orphan every cache
    "S324",
    # The result of `subprocess.run` is inspected by hand so the error can name the file that failed
    "PLW1510",
    # TODO comments are left without an author or a tracking link
    "FIX002",
    "TD002",
    "TD003",
    # `inplace=` is used on frames that are local and about to be written out
    "PD002",
    # Exception messages are built at the raise site rather than in one-off exception subclasses
    "EM101",
    "EM102",
    "TRY003",
    # Non-ASCII characters appear in prose deliberately
    "RUF002",
    # The few remaining `open()` calls are deliberate
    "PTH123",
    # Imports are not split into `TYPE_CHECKING` blocks
    "TC001",
    "TC002",
    "TC003",
    # Annotations are extensive but not required on every private helper
    "ANN003",
    "ANN202",
    # Unused arguments are protocol conformance or signature compatibility
    "ARG001",
    "ARG002",

    # --- Worth revisiting, but each would change behavior ---------------------------------------------
    # `zip()` truncates to the shortest input. The summarize accumulations zip three lists that are
    # built in step with one another, so `strict=True` would be a correctness assertion rather than a
    # style fix, and would newly raise where today it silently drops. Left as-is deliberately
    "B905",
    # The published service range listings are fetched without a timeout, so a hung connection blocks
    # the run. Adding one is a robustness improvement rather than a neutral edit
    "S113",
    # Timestamps are parsed and formatted naive, which is what the summaries have always published
    "DTZ007",
    "UP017",

    # --- Mechanical, and not worth the churn on their own ----------------------------------------------
    "B007",
    "FURB116",
    "PLC0206",
    "PLC0207",
    "PYI034",
    "PYI041",
    "RUF007",
    "RUF015",
    "RUF021",
    "UP015",
    "UP024",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"
known-first-party = ["s3_log_extraction"]

[tool.ruff.lint.per-file-ignores]
"src/s3_log_extraction/_hidden_top_level_imports.py" = ["F401"]  # Must perform imports here even if not exposed
# The published testing helpers assert on behalf of their caller, which is the point of the module
"src/s3_log_extraction/testing/_assertions.py" = ["S101"]
# Tests assert (S101), reach into private names on purpose (SLF001), are not an importable package
# (INP001), and do not carry module or function docstrings (D100, D103, D200). The rest are shapes
# that read fine in a test and would only add noise to chase
"tests/**/*.py" = [
    "S101",
    "SLF001",
    "INP001",
    "D100",
    "D103",
    "D200",
    "ANN201",
    "ARG005",
    "B904",
    "PT006",
    "PT018",
    "RUF003",
    "RUF005",
    "RUF010",
    "S301",
    "SIM117",
]
# `tools/` holds one-off maintenance scripts rather than an importable package
"tools/**/*.py" = ["INP001", "D103", "T201"]


[tool.mypy]
python_version = "3.14"
files = ["src/s3_log_extraction"]
# The optional `geolocation` and `remote` extras ship no stubs, and are deliberately absent from a base
# install, so their imports cannot be resolved here
ignore_missing_imports = true

# These ten modules are not yet clean. The errors in them are narrowing rather than defects: a subprocess
# helper whose return is `str | None` only on a path none of these callers take, resolvers that mypy cannot
# see are non-None after the branch that constructs them, and the lazily imported optional extras that are
# annotated as strings. They are listed one by one, rather than silenced with a blanket rule, so that the
# debt stays visible and can be paid down a module at a time. The other thirty-three modules are checked,
# as is anything added later.
[[tool.mypy.overrides]]
module = [
    "s3_log_extraction._command_line_interface._cli",
    "s3_log_extraction.extractors._remote_s3_log_access_extractor",
    "s3_log_extraction.ip_utils._geolite2",
    "s3_log_extraction.ip_utils._ip_utils",
    "s3_log_extraction.ip_utils._region_codes",
    "s3_log_extraction.ip_utils._resolver",
    "s3_log_extraction.ip_utils._update_region_code_coordinates",
    "s3_log_extraction.summarize._generate_summaries",
    "s3_log_extraction.testing._assertions",
    "s3_log_extraction.utils.inventory",
]
ignore_errors = true


[tool.codespell]
skip = "*/ip_utils/_data/*"  # Three-letter ISO 3166 codes look like misspelled words


[tool.pytest.ini_options]
markers = [
    "remote: mark a test as requiring remote resources",
    "ai_generated: mark a test as AI-generated",
]
env = [
    "S3_LOG_EXTRACTION_PASSWORD=test",
]
